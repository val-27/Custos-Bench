[package]
name = "custos-bench"
version = "0.1.0"
edition = "2021"
description = "Coordinated-omission-free open-loop HTTP/2 gRPC load generator for Custos admission benchmarks"
license = "Apache-2.0"
publish = false

[[bin]]
name = "custos-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
http = "1"
quanta = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
tonic = { version = "0.14", features = ["transport"] }
tower = "0.5"

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-stream = "0.1"
